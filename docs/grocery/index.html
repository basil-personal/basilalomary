<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Ashbaugh–Alomary Grocery List</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"/>
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex"/>

<style>
  :root{
    --bg:#0b1220; --card:#0f172a; --ink:#e5e7eb; --muted:#9ca3af; --line:#23304a;
    --brand:#4f8cff; --brand2:#2e6fff; --chip:#142036; --chip2:#101b2e;
    --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b;
    --h:44px;       /* standard control height (larger for touch) */
    --radius:14px;  /* rounder on mobile */
    --sp:12px;      /* spacing unit */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;}

/* HEADER */
  .wrap{max-width:880px;margin:0 auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom));}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{font-size:28px}
  h1{font-size:20px;margin:0}
  .status{margin-left:auto;background:#10261b;border:1px solid #1b4d3a;color:#86efac;border-radius:999px;padding:6px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
  .status.off{background:#2a1212;border-color:#4d1b1b;color:#fca5a5}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* TABS */
  .tabs{display:flex;gap:8px;margin:8px 0 10px}
  .seg{flex:1;display:flex;background:var(--chip2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 0;font-weight:700}
  .seg button.active{background:var(--brand);color:#fff}

/* SEARCH (top, big) */
  .row-top{display:flex;gap:10px;align-items:center}
  .input{background:#0b1220;border:1px solid var(--line);border-radius:var(--radius);height:var(--h);padding:0 14px;color:var(--ink);flex:1}
  .btn{background:var(--brand);border:0;color:#fff;border-radius:var(--radius);height:var(--h);padding:0 16px;font-weight:800}
  .btn.secondary{background:var(--chip)}

/* LIST */
  .list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .secHeader{display:flex;align-items:center;gap:10px;background:var(--chip);border:1px solid var(--line);padding:10px 12px;border-radius:12px}
  .pill{background:#0f1b2f;border:1px solid #1a2946;color:#cdd9ff;border-radius:999px;padding:4px 8px;font-size:12px}

  /* Card row (mobile-first) */
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .name[contenteditable]{display:block;outline:0;border-radius:10px;padding:8px 10px;font-size:18px;line-height:1.2;background:#0b1220;border:1px solid #1a2744}
  .rowGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .select, .qty input{background:#0b1220;border:1px solid var(--line);border-radius:12px;height:42px;color:var(--ink);width:100%}
  .qty{display:flex;gap:8px;align-items:center}
  .iconBtn{width:42px;height:42px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-size:20px;font-weight:900}
  .switchRow{display:flex;gap:10px;margin-top:10px}
  .switch{flex:1;display:flex;align-items:center;justify-content:space-between;background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .check{width:56px;height:32px;border-radius:18px;background:#1e2a44;border:1px solid #2f3d5c;position:relative;transition:.2s}
  .check::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
  .check.on{background:var(--brand2);border-color:var(--brand2)}
  .check.on::after{left:27px}
  .danger{background:#2a1212;border:1px solid #4d1b1b;color:#ffb4b4}
  .dangerBtn{background:#d72d2d}

  /* gestures helpers */
  .swipe{touch-action:pan-y}
  .hint{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;color:#9aa3b3;opacity:.0;transition:.2s}
  .hint.left{right:10px} .hint.right{left:10px}
  .card.swiping .hint{opacity:.8}

  /* DESKTOP enhancements */
  @media (min-width: 760px){
    .wrap{padding-bottom:120px}
    .card .rowGrid{grid-template-columns:1.1fr 1.1fr 1fr;align-items:center}
    .switchRow{margin-top:6px}
  }

/* STICKY ADD BAR (bottom) */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(180deg,transparent,rgba(11,18,32,.9) 15%, rgba(11,18,32,.98) 40%);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .barInner{max-width:880px;margin:0 auto;display:flex;gap:8px}
  .bar .input{height:48px}
  .bar .btn{height:48px;padding:0 18px}

/* PASSWORD GATE */
  #gate{display:grid;place-items:center;background:linear-gradient(180deg,#0b1220,#0d1426)}
  #gate.hidden{display:none}
  .gate-card{width:min(92vw,460px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .gate-title{font-weight:800;font-size:20px;margin-bottom:4px}
  .gate-sub{color:var(--muted);margin-bottom:14px}
  .gate-row{display:flex;gap:8px}
  .gate-input{flex:1;background:#0b1220;border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;height:46px}
  .gate-btn{background:var(--brand);border:0;border-radius:12px;color:#fff;padding:0 16px;font-weight:700;height:46px}
  .gate-err{min-height:16px;color:#fca5a5;margin-top:8px}

  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(10px);background:#101826;border:1px solid var(--line);padding:10px 14px;border-radius:10px;opacity:0;transition:.2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate" role="dialog" aria-modal="true">
  <div class="gate-card">
    <div class="gate-title">Enter password</div>
    <div class="gate-sub">Ashbaugh–Alomary Grocery List</div>
    <div class="gate-row">
      <input id="gateInput" class="gate-input" type="password" placeholder="Password" autofocus/>
      <button id="gateBtn" class="gate-btn">Unlock</button>
    </div>
    <div id="gateErr" class="gate-err"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="logo">🛒</div><h1>Ashbaugh–Alomary Grocery List</h1>
    <div id="status" class="status off"><span class="dot" style="background:var(--bad)"></span><span id="statusText">Offline</span></div>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <div class="seg" role="tablist" aria-label="Views">
      <button id="tabActive" class="active" role="tab" aria-selected="true">Shopping</button>
      <button id="tabInactive" role="tab" aria-selected="false">Inactive</button>
    </div>
  </div>

  <!-- Search -->
  <div class="row-top">
    <input id="search" class="input" placeholder="Search items…"/>
    <button id="copyBtn" class="btn secondary" title="Copy active list">Copy</button>
  </div>

  <!-- List -->
  <div id="list" class="list"></div>
</div>

<!-- Sticky Add Bar -->
<div class="bar">
  <div class="barInner">
    <input id="quick" class="input" placeholder="Quick Add: milk x2 @dairy, bread @bakery, apples 4"/>
    <button id="quickBtn" class="btn">Add</button>
  </div>
</div>

<div id="toast" class="toast">Saved</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/* =============== Password gate (keep your hash) =============== */
const PASSWORD_HASH = "REPLACE_WITH_SHA256_HEX";
async function sha256Hex(t){const b=new TextEncoder().encode(t);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryUnlock(){
  const v=document.getElementById('gateInput').value||"";
  if((await sha256Hex(v))===PASSWORD_HASH){
    sessionStorage.setItem('grocery_authed','1');
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').style.display='block';
    initFirebase();
  }else{ document.getElementById('gateErr').textContent='Incorrect password'; }
}
document.getElementById('gateBtn').onclick=tryUnlock;
document.getElementById('gateInput').addEventListener('keypress',e=>{ if(e.key==='Enter') tryUnlock(); });
if(sessionStorage.getItem('grocery_authed')==='1'){ document.getElementById('gate').classList.add('hidden'); document.getElementById('app').style.display='block'; setTimeout(initFirebase,0); }

/* =============== App state & helpers =============== */
const listId='beans-main-list';
const SECTIONS=['Bakery','Dairy','Deli','Produce','Meat','Frozen','Other'];
let database=null, grocery={}, filter='', showActive=true;

const qs=(s,el=document)=>el.querySelector(s);
const toast=(t='Saved')=>{ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),900); if(navigator.vibrate) navigator.vibrate(12); };
const clampInt=(v,d=1)=>{ const n=parseInt(v,10); return Number.isFinite(n)&&n>0? n:d; };

/* =============== Firebase (anon auth) =============== */
function initFirebase(){
  const cfg={apiKey:"AIzaSyCQpMDkuFNc1jWH1I_WQZ8Ev2UA2HgEGCI",
    authDomain:"grocery-list-44616.firebaseapp.com",
    databaseURL:"https://grocery-list-44616-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:"grocery-list-44616"};
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  firebase.auth().onAuthStateChanged(u=>{
    if(u){ database=firebase.database(); attach(); } else { firebase.auth().signInAnonymously().catch(console.error); }
  });
}
function attach(){
  database.ref(`lists/${listId}/items`).on('value', snap=>{
    grocery=snap.val()||{}; render(); setOnline(true);
  }, err=>{ console.error(err); setOnline(false);});
  database.ref('.info/connected').on('value', s=> setOnline(s.val()===true));
}
function setOnline(on){
  const st=qs('#status'), tx=qs('#statusText'), dot=st.querySelector('.dot');
  if(on){ st.classList.remove('off'); tx.textContent='Connected'; dot.style.background='var(--ok)'; }
  else  { st.classList.add('off'); tx.textContent='Offline';  dot.style.background='var(--bad)'; }
}

/* =============== Quick Add parsing & actions =============== */
function parseQuick(str){
  return str.split(',').map(p=>p.trim()).filter(Boolean).map(tok=>{
    let name=tok, qty=1, sec='';
    const mSec=tok.match(/@([a-z]+)$/i); if(mSec){ sec=mSec[1]; name=tok.replace(/@([a-z]+)$/i,'').trim(); }
    const mQty=name.match(/(?:x|\*)\s*(\d+)$/i) || name.match(/(\d+)$/);
    if(mQty){ qty=parseInt(mQty[1],10)||1; name=name.replace(mQty[0],'').trim(); }
    const section = SECTIONS.find(s=>s.toLowerCase()===(sec||'').toLowerCase()) || 'Other';
    return {name, section, quantity:qty};
  }).filter(it=>it.name.length>0);
}
function upsertItem({name,section,quantity}){
  const entries=Object.entries(grocery);
  const found=entries.find(([id,it])=> it && it.name && it.name.toLowerCase()===name.toLowerCase() && it.section===section);
  if(found){
    const [id,it]=found;
    return database.ref(`lists/${listId}/items/${id}`).update({
      quantity: clampInt((it.quantity||0)+clampInt(quantity,1),1),
      active:true,lastUpdated:Date.now()
    });
  }else{
    const it={name,section,quantity:clampInt(quantity,1),purchased:false,active:true,createdAt:Date.now()};
    return database.ref(`lists/${listId}/items`).push(it);
  }
}

/* =============== Rendering (mobile-first cards) =============== */
function render(){
  const container=qs('#list'); container.innerHTML='';
  const arr=Object.entries(grocery).map(([id,it])=>({...it,id}));
  const items=arr.filter(it=> showActive ? it.active : !it.active)
                 .filter(it=> filter ? (it.name.toLowerCase().includes(filter) || it.section.toLowerCase().includes(filter)) : true);

  const grouped = SECTIONS.map(sec => [sec, items.filter(it=>it.section===sec)]).filter(([_,g])=>g.length);
  if(!grouped.length){ const empty=document.createElement('div'); empty.style.color='#9ca3af'; empty.style.padding='20px'; empty.textContent= showActive ? 'No active items.' : 'No inactive items.'; container.appendChild(empty); return; }

  for(const [sec, group] of grouped){
    const h=document.createElement('div'); h.className='secHeader';
    h.innerHTML=`<strong>${sec}</strong><span class="pill">${group.length}</span>`;
    const bCollapse = mkBtn('Collapse','secondary',()=>toggleBlock(listEl,h,sec));
    const bBulk     = mkBtn(showActive?'To Inactive':'Reactivate','secondary',()=>bulkActive(sec,!showActive));
    h.append(bCollapse,bBulk);
    container.appendChild(h);

    const listEl=document.createElement('div');
    listEl.className='section';
    group.forEach(it => listEl.appendChild(rowCard(it)));
    container.appendChild(listEl);
  }
}
function mkBtn(label,type,fn){ const b=document.createElement('button'); b.className='btn '+(type||''); b.textContent=label; b.onclick=fn; return b; }
function toggleBlock(el,head,sec){ const vis=el.style.display!=='none'; el.style.display=vis?'none':'block'; head.firstChild.textContent = (vis?'▶ ':'') + sec; }

function rowCard(it){
  const card=document.createElement('div'); card.className='card swipe'; card.setAttribute('data-id',it.id);

  // swipe hints
  const hl=document.createElement('div'); hl.className='hint left';  hl.textContent='Delete';
  const hr=document.createElement('div'); hr.className='hint right'; hr.textContent='Purchased';
  card.append(hl,hr);

  // Name (editable)
  const name=document.createElement('div'); name.className='name'; name.contentEditable='true'; name.textContent=it.name;
  name.addEventListener('blur',()=>{ const v=name.textContent.trim(); if(v && v!==it.name){ database.ref(`lists/${listId}/items/${it.id}`).update({name:v}).then(()=>toast()); } else { name.textContent=it.name; }});
  card.appendChild(name);

  // Grid: Section, Quantity, (desktop also shows both in a line)
  const grid=document.createElement('div'); grid.className='rowGrid';

  // Section
  const secWrap=document.createElement('div');
  const sel=document.createElement('select'); sel.className='select';
  SECTIONS.forEach(s=> sel.add(new Option(s,s,s===it.section,s===it.section)));
  sel.onchange=()=> database.ref(`lists/${listId}/items/${it.id}`).update({section:sel.value}).then(()=>toast());
  secWrap.appendChild(sel);
  grid.appendChild(secWrap);

  // Quantity
  const qty=document.createElement('div'); qty.className='qty';
  const minus=iconBtn('−',()=> setQty(it.id,(it.quantity||1)-1));
  const qInput=document.createElement('input'); qInput.className='select'; qInput.value=it.quantity||1; qInput.onblur=()=> setQty(it.id,qInput.value); qInput.onkeypress=(e)=>{ if(e.key==='Enter'){ qInput.blur(); } };
  const plus=iconBtn('+',()=> setQty(it.id,(it.quantity||1)+1));
  qty.append(minus,qInput,plus); grid.appendChild(qty);

  card.appendChild(grid);

  // Switch row (Purchased / Active)
  const sw=document.createElement('div'); sw.className='switchRow';

  const purBox=document.createElement('div'); purBox.className='switch';
  purBox.innerHTML=`<span>Purchased</span>`;
  const pur = document.createElement('div'); pur.className='check'+(it.purchased?' on':'');
  pur.onclick=()=> database.ref(`lists/${listId}/items/${it.id}`).update({purchased:!it.purchased}).then(()=>toast());
  purBox.appendChild(pur);

  const actBox=document.createElement('div'); actBox.className='switch';
  actBox.innerHTML=`<span>Active</span>`;
  const act = document.createElement('div'); act.className='check'+(it.active?' on':'');
  act.onclick=()=> database.ref(`lists/${listId}/items/${it.id}`).update({active:!it.active}).then(()=>toast());
  actBox.appendChild(act);

  const delBox=document.createElement('div'); delBox.className='switch danger';
  delBox.innerHTML=`<span>Delete</span>`;
  const del = document.createElement('button'); del.className='iconBtn dangerBtn'; del.textContent='×';
  del.onclick=()=> onDelete(it.id);
  delBox.appendChild(del);

  sw.append(purBox,actBox,delBox);
  card.appendChild(sw);

  enableSwipe(card, it.id);
  return card;
}
function iconBtn(txt,fn){ const b=document.createElement('button'); b.className='iconBtn'; b.textContent=txt; b.onclick=fn; return b; }
function setQty(id,val){ const q=clampInt(val,1); return database.ref(`lists/${listId}/items/${id}`).update({quantity:q}).then(()=>toast()); }

function onDelete(id){ if(confirm('Delete this item?')) database.ref(`lists/${listId}/items/${id}`).remove().then(()=>toast('Deleted')); }

/* =============== Swipe gestures (mobile) =============== */
function enableSwipe(el, id){
  let x0=null, dragging=false;
  el.addEventListener('touchstart',e=>{ if(e.touches.length!==1) return; x0=e.touches[0].clientX; dragging=true; el.classList.add('swiping'); },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!dragging) return;
    const dx=e.touches[0].clientX - x0;
    el.style.transform=`translateX(${dx}px)`;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!dragging) return;
    dragging=false; el.classList.remove('swiping');
    const dx=(e.changedTouches[0].clientX - x0);
    el.style.transform='';
    if(dx > 80){ // right swipe → purchased toggle
      const it=grocery[id]; if(it) database.ref(`lists/${listId}/items/${id}`).update({purchased:!it.purchased}).then(()=>toast(it.purchased?'Unmarked':'Purchased'));
    }else if(dx < -80){ // left swipe → delete
      onDelete(id);
    }
  });
}

/* =============== Bulk ops & helpers =============== */
function bulkActive(section,flag){
  const updates={}; Object.entries(grocery).forEach(([id,it])=>{ if(it.section===section) updates[`lists/${listId}/items/${id}/active`]=flag; });
  if(Object.keys(updates).length) database.ref().update(updates).then(()=>toast(flag?'Reactivated':'Archived'));
}
function toggleBlock(el,head,sec){ const vis=el.style.display!=='none'; el.style.display=vis?'none':'block'; head.firstChild.textContent=(vis?'▶ ':'')+sec; }

/* =============== Controls wiring =============== */
document.getElementById('quickBtn').onclick=()=>{
  const t=qs('#quick').value.trim(); if(!t) return;
  const items=parseQuick(t); if(!items.length) return;
  Promise.all(items.map(upsertItem)).then(()=>{ qs('#quick').value=''; toast('Added'); });
};
qs('#quick').addEventListener('keypress',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('quickBtn').click(); }});
qs('#search').addEventListener('input',e=>{ filter=e.target.value.trim().toLowerCase(); render(); });
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); qs('#quick').focus(); }});

qs('#tabActive').onclick=()=>{ showActive=true; tabSet(true); render(); };
qs('#tabInactive').onclick=()=>{ showActive=false; tabSet(false); render(); };
function tabSet(active){
  qs('#tabActive').classList.toggle('active', active);
  qs('#tabInactive').classList.toggle('active', !active);
  qs('#tabActive').setAttribute('aria-selected', active?'true':'false');
  qs('#tabInactive').setAttribute('aria-selected', !active?'true':'false');
}

/* Copy active list */
qs('#copyBtn').onclick=async()=>{
  const active = Object.values(grocery).filter(it=>it.active && !it.purchased);
  const txt = active.map(it=>`${it.name} x${it.quantity} [${it.section}]`).join('\n');
  await navigator.clipboard.writeText(txt);
  toast('Copied');
};
</script>
</body>
</html>
