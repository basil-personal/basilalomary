<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Ashbaugh–Alomary Grocery List</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"/>
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex"/>

<style>
  :root{
    color-scheme:dark;
    --bg:#050912;
    --bg-soft:rgba(14,23,42,.7);
    --card:#0b1220;
    --ink:#f1f5f9;
    --muted:#93a5ce;
    --line:rgba(79,140,255,.18);
    --brand:#5a8cff;
    --brand2:#386bff;
    --chip:#131d33;
    --chip2:#0f172a;
    --ok:#34d399;
    --bad:#f87171;
    --shadow:0 24px 60px rgba(5,9,18,.45);
    --h:44px;          /* thumb-friendly default height */
    --r:16px;          /* radius */
    --sp:14px;         /* spacing */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 120% at 20% 0%,rgba(63,118,255,.3) 0,transparent 60%),
               radial-gradient(120% 120% at 90% 10%,rgba(34,197,94,.22) 0,transparent 55%),
               var(--bg);
    color:var(--ink);
    font:16px/1.5 "SF Pro Display", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:20px;
    min-height:100%;
  }
  header{
    position:sticky;
    top:calc(env(safe-area-inset-top) + 14px);
    z-index:20;
    background:linear-gradient(140deg,rgba(23,32,56,.88),rgba(11,18,32,.92));
    border:1px solid var(--line);
    border-radius:22px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
  }
  .logo{font-size:26px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.01em}
  .status{
    margin-left:auto;
    background:rgba(12,40,24,.65);
    border:1px solid rgba(76,171,118,.45);
    color:#a7f3d0;
    border-radius:999px;
    padding:6px 12px;
    font-size:12px;
    display:flex;
    gap:8px;
    align-items:center;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .status.off{background:rgba(56,15,20,.65);border-color:rgba(239,68,68,.5);color:#fecaca}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2)}

  .seg{
    display:flex;
    background:rgba(20,32,58,.65);
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    padding:4px;
    box-shadow:var(--shadow);
    gap:4px;
  }
  .seg button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
    padding:10px 0;
    font-weight:700;
    border-radius:999px;
    font-size:15px;
    transition:background .22s ease,color .22s ease;
  }
  .seg button.active{
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;
    box-shadow:0 12px 30px rgba(74,123,255,.35);
  }

  .input{
    background:linear-gradient(140deg,rgba(26,38,66,.96),rgba(14,21,36,.92));
    border:1px solid rgba(80,116,182,.45);
    border-radius:18px;
    height:var(--h);
    padding:0 16px;
    color:var(--ink);
    width:100%;
    box-shadow:inset 0 0 0 1px rgba(74,123,255,.12);
    transition:border .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .input:focus-visible{
    outline:none;
    border-color:rgba(117,158,255,.8);
    box-shadow:0 0 0 4px rgba(117,158,255,.18);
    background:linear-gradient(140deg,rgba(35,49,84,.96),rgba(19,28,48,.92));
  }
  .btn{
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    border:0;
    color:#fff;
    border-radius:18px;
    height:var(--h);
    padding:0 20px;
    font-weight:800;
    letter-spacing:.01em;
    box-shadow:0 18px 32px rgba(74,123,255,.35);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn.secondary{
    background:rgba(20,32,58,.65);
    box-shadow:none;
    border:1px solid rgba(86,106,149,.6);
    color:var(--ink);
  }
  .btn:active{transform:scale(.96)}
  .btn.secondary:active{transform:scale(.98)}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

  .row-top{
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:stretch;
  }

  .list{display:flex;flex-direction:column;gap:16px}
  .emptyState{
    padding:32px;
    text-align:center;
    background:rgba(13,20,36,.78);
    border:1px solid rgba(74,123,255,.24);
    border-radius:22px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.02em;
    box-shadow:var(--shadow);
  }
  .secHeader{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(20,33,58,.78);
    border:1px solid var(--line);
    padding:12px 14px;
    border-radius:18px;
    position:sticky;
    top:calc(env(safe-area-inset-top) + 96px);
    z-index:10;
    backdrop-filter:blur(14px);
    box-shadow:0 18px 40px rgba(5,9,18,.45);
  }
  .secHeader strong{font-size:15px;letter-spacing:.08em;text-transform:uppercase}
  .secHeader.collapsed{opacity:.78}
  .secList{display:flex;flex-direction:column;gap:18px;padding-top:6px;margin-bottom:32px}
  .pill{background:rgba(90,140,255,.18);border:1px solid rgba(90,140,255,.5);color:#cbd8ff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.04em}
  .secHeader .btn{height:36px;padding:0 12px;font-size:13px;flex-shrink:0}

  /* Row card */
  .card{
    background:linear-gradient(160deg,rgba(15,23,42,.9),rgba(9,14,24,.92));
    border:1px solid rgba(82,133,222,.22);
    border-radius:22px;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:16px;
    box-shadow:var(--shadow);
  }
  .cardTop{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
  .name[contenteditable]{
    outline:0;
    border-radius:16px;
    padding:10px 14px;
    font-size:18px;
    line-height:1.3;
    background:rgba(12,20,36,.78);
    border:1px solid transparent;
    box-shadow:inset 0 0 0 1px rgba(74,123,255,.12);
    transition:border .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .name[contenteditable]:focus-visible{
    border-color:rgba(117,158,255,.7);
    box-shadow:0 0 0 3px rgba(117,158,255,.2);
    background:rgba(21,33,55,.9);
  }
  .tag{background:rgba(90,140,255,.15);border:1px solid rgba(90,140,255,.4);color:#dbe4ff;border-radius:999px;padding:4px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .tag-soft{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.45);color:#befae0}
  .tag-warn{background:rgba(248,113,113,.18);border-color:rgba(248,113,113,.5);color:#fee2e2}

  .rowGrid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    align-items:stretch;
  }
  .field{
    background:rgba(16,26,44,.82);
    border:1px solid rgba(70,108,173,.25);
    border-radius:16px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:inset 0 0 0 1px rgba(74,123,255,.08);
  }
  .sectionField{grid-column:1/-1;padding:0}
  .sectionField select{
    background:transparent;
    border:0;
    color:var(--ink);
    width:100%;
    padding:12px 14px;
    font-size:16px;
    font-weight:600;
    border-radius:14px;
    appearance:none;
    outline:none;
  }
  .sectionField select option{color:#0f172a}

  .qty{justify-content:space-between}
  .qty input{
    width:64px;
    height:40px;
    text-align:center;
    border:1px solid rgba(82,133,222,.35);
    border-radius:12px;
    background:rgba(9,14,24,.9);
    color:var(--ink);
    font-weight:700;
    font-size:16px;
  }
  .qty input::-webkit-outer-spin-button,
  .qty input::-webkit-inner-spin-button{appearance:none;margin:0}
  .qty input[type=number]{-moz-appearance:textfield}
  .iconBtn{
    width:42px;
    height:42px;
    border-radius:14px;
    border:0;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;
    font-size:20px;
    font-weight:900;
    box-shadow:0 14px 28px rgba(74,123,255,.35);
    cursor:pointer;
  }
  .iconBtn:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(117,158,255,.28);
  }
  .iconBtn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

  .flag{justify-content:space-between}
  .flag span{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .switch{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:6px 14px 6px 8px;
    border-radius:999px;
    background:rgba(24,38,68,.75);
    border:1px solid rgba(74,123,255,.35);
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    cursor:pointer;
    transition:background .2s ease,border .2s ease,color .2s ease;
  }
  .switch.on{background:rgba(74,123,255,.28);border-color:rgba(117,158,255,.7);color:#fff}
  .switch:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(117,158,255,.28);
  }
  .switch:disabled{opacity:.6;cursor:wait}
  .switchKnob{
    width:26px;
    height:26px;
    border-radius:50%;
    background:linear-gradient(135deg,#fff,#e7edff);
    box-shadow:0 8px 16px rgba(15,23,42,.45);
    position:relative;
  }
  .switch.on .switchKnob{background:linear-gradient(135deg,#fff,#e2e7ff)}

  .switchText{min-width:34px;text-align:center}

  .delBtn{
    width:56px;
    height:56px;
    border-radius:18px;
    border:0;
    background:linear-gradient(135deg,#ff5f6d,#c81e3d);
    color:#fff;
    font-weight:800;
    font-size:20px;
    box-shadow:0 20px 36px rgba(200,30,61,.45);
    cursor:pointer;
  }

  .actions{display:flex;align-items:center;justify-content:center;padding:0;background:transparent;border:none}

  /* Bottom sticky add bar */
  .bar{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:30;
    background:linear-gradient(180deg,transparent,rgba(5,9,18,.7) 15%,rgba(5,9,18,.95) 55%);
    padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .barInner{
    max-width:880px;
    margin:0 auto;
    display:flex;
    gap:10px;
    background:rgba(15,23,42,.92);
    border:1px solid rgba(74,123,255,.25);
    border-radius:22px;
    padding:12px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(14px);
  }
  .bar .input{height:48px;font-size:15px}
  .bar .btn{height:48px;padding:0 24px}

  /* Desktop tweaks */
  @media (min-width:560px){
    .row-top{flex-direction:row;align-items:center}
  }
  @media (min-width:720px){
    .wrap{padding-bottom:160px}
    header{top:calc(env(safe-area-inset-top) + 24px)}
    .rowGrid{grid-template-columns:1.1fr 0.9fr auto auto auto;align-items:center}
    .sectionField{grid-column:auto;padding:0 14px}
    .secHeader{top:calc(env(safe-area-inset-top) + 108px)}
    .delBtn{width:48px;height:48px}
  }
  @media (max-width:420px){
    .barInner{flex-direction:column}
    .bar .btn{width:100%}
  }

  @media (hover:hover){
    .btn:hover:not(.secondary){box-shadow:0 22px 36px rgba(74,123,255,.45)}
    .btn.secondary:hover{border-color:rgba(117,158,255,.6)}
    .switch:hover{border-color:rgba(117,158,255,.6)}
    .delBtn:hover{box-shadow:0 28px 48px rgba(200,30,61,.55)}
  }

  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(15,23,42,.92);border:1px solid rgba(117,158,255,.4);padding:12px 18px;border-radius:16px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#dbe4ff;opacity:0;transition:.2s;box-shadow:var(--shadow);backdrop-filter:blur(12px);z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header>
    <div class="logo">🛒</div><h1>Ashbaugh–Alomary Grocery List</h1>
    <div id="status" class="status off"><span class="dot" style="background:var(--bad)"></span><span id="statusText">Offline</span></div>
  </header>

  <div class="seg" role="tablist">
    <button id="tabActive" class="active" role="tab" aria-selected="true">Shopping</button>
    <button id="tabInactive" role="tab" aria-selected="false">Inactive</button>
  </div>

  <div class="row-top">
    <input id="search" class="input" placeholder="Search items…"/>
    <button id="copyBtn" class="btn secondary" title="Copy active list">Copy</button>
  </div>

  <div id="list" class="list"></div>
</div>

<!-- Sticky Add Bar -->
<div class="bar">
  <div class="barInner">
    <input id="quick" class="input" placeholder="Quick Add: milk x2 @dairy, bread @bakery, apples 4"/>
    <button id="quickBtn" class="btn">Add</button>
  </div>
</div>

<div id="toast" class="toast">Saved</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/*** App state ***/
const listId='beans-main-list';
const SECTIONS=['Bakery','Dairy','Deli','Produce','Meat','Frozen','Other'];
let database=null, grocery={}, filter='', showActive=true;

const qs=(s,el=document)=>el.querySelector(s);
const toast=(t='Saved')=>{ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),800); if(navigator.vibrate) navigator.vibrate(8); };
const clampInt=(v,d=1)=>{ const n=parseInt(v,10); return Number.isFinite(n)&&n>0? n:d; };

/*** Firebase init ***/
function initFirebase(){
  const cfg={ apiKey:"AIzaSyCQpMDkuFNc1jWH1I_WQZ8Ev2UA2HgEGCI",
    authDomain:"grocery-list-44616.firebaseapp.com",
    databaseURL:"https://grocery-list-44616-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:"grocery-list-44616" };
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  firebase.auth().onAuthStateChanged(u=>{
    if(u){ database=firebase.database(); attach(); } else { firebase.auth().signInAnonymously().catch(console.error); }
  });
}
function attach(){
  database.ref(`lists/${listId}/items`).on('value', snap=>{
    grocery=snap.val()||{}; render(); setOnline(true);
  }, err=>{ console.error(err); setOnline(false);});
  database.ref('.info/connected').on('value', s=> setOnline(s.val()===true));
}
function setOnline(on){
  const st=qs('#status'), tx=qs('#statusText'), dot=st.querySelector('.dot');
  if(on){
    st.classList.remove('off');
    tx.textContent='Connected';
    dot.style.background='var(--ok)';
    dot.style.boxShadow='0 0 0 3px rgba(52,211,153,.2)';
  }
  else{
    st.classList.add('off');
    tx.textContent='Offline';
    dot.style.background='var(--bad)';
    dot.style.boxShadow='0 0 0 3px rgba(248,113,113,.25)';
  }
}

/*** Quick Add ***/
function parseQuick(str){
  return str.split(',').map(p=>p.trim()).filter(Boolean).map(tok=>{
    let name=tok, qty=1, sec='';
    const mSec=tok.match(/@([a-z]+)$/i); if(mSec){ sec=mSec[1]; name=tok.replace(/@([a-z]+)$/i,'').trim(); }
    const mQty=name.match(/(?:x|\*)\s*(\d+)$/i) || name.match(/(\d+)$/);
    if(mQty){ qty=parseInt(mQty[1],10)||1; name=name.replace(mQty[0],'').trim(); }
    const section = SECTIONS.find(s=>s.toLowerCase()===(sec||'').toLowerCase()) || 'Other';
    return {name, section, quantity:qty};
  }).filter(it=>it.name.length>0);
}
function upsertItem({name,section,quantity}){
  const entries=Object.entries(grocery);
  const found=entries.find(([id,it])=> it && it.name && it.name.toLowerCase()===name.toLowerCase() && it.section===section);
  if(found){
    const [id,it]=found;
    return database.ref(`lists/${listId}/items/${id}`).update({
      quantity: clampInt((it.quantity||0)+clampInt(quantity,1),1),
      active:true,lastUpdated:Date.now()
    });
  }else{
    const it={name,section,quantity:clampInt(quantity,1),purchased:false,active:true,createdAt:Date.now()};
    return database.ref(`lists/${listId}/items`).push(it);
  }
}

/*** Render ***/
function render(){
  const container=qs('#list'); container.innerHTML='';
  const arr=Object.entries(grocery).map(([id,it])=>({...it,id}));
  const items=arr.filter(it=> showActive ? it.active : !it.active)
                 .filter(it=> filter ? (it.name.toLowerCase().includes(filter) || it.section.toLowerCase().includes(filter)) : true);

  const grouped = SECTIONS.map(sec => [sec, items.filter(it=>it.section===sec)]).filter(([_,g])=>g.length);
  if(!grouped.length){
    const empty=document.createElement('div');
    empty.className='emptyState';
    empty.textContent= showActive ? 'Your shopping list is clear — enjoy the day!' : 'Nothing resting here yet.';
    container.appendChild(empty);
    return;
  }

  for(const [sec, group] of grouped){
    const header=document.createElement('div'); header.className='secHeader';
    header.innerHTML=`<strong>${sec}</strong><span class="pill">${group.length}</span>`;
    const sectionSlug=sec.toLowerCase().replace(/[^a-z0-9]+/g,'-');
    const btnCollapse=mkBtn('Hide','secondary',()=>toggleBlock(listEl,header,sec,btnCollapse));
    btnCollapse.setAttribute('aria-expanded','true');
    const btnMove=mkBtn(showActive?'To Inactive':'Reactivate','secondary',()=>bulkActive(sec,!showActive));
    header.append(btnCollapse,btnMove);
    container.appendChild(header);

    const listEl=document.createElement('div');
    listEl.className='secList';
    listEl.id=`section-${sectionSlug}`;
    btnCollapse.setAttribute('aria-controls',listEl.id);
    group.forEach(it => listEl.appendChild(rowCard(it)));
    container.appendChild(listEl);
  }
}
function mkBtn(label,type,fn){ const b=document.createElement('button'); b.className='btn '+(type||''); b.textContent=label; b.type='button'; b.onclick=fn; return b; }
function toggleBlock(el,head,sec,btn){
  const collapsed=el.style.display==='none';
  if(collapsed){
    el.style.display='';
    head.classList.remove('collapsed');
    head.querySelector('strong').textContent=sec;
    if(btn){ btn.textContent='Hide'; btn.setAttribute('aria-expanded','true'); }
  }else{
    el.style.display='none';
    head.classList.add('collapsed');
    head.querySelector('strong').textContent=`▶ ${sec}`;
    if(btn){ btn.textContent='Show'; btn.setAttribute('aria-expanded','false'); }
  }
}

function rowCard(it){
  const c=document.createElement('div'); c.className='card';

  const top=document.createElement('div'); top.className='cardTop';
  const sectionTag=document.createElement('span'); sectionTag.className='tag'; sectionTag.textContent=it.section;
  top.appendChild(sectionTag);
  if(it.purchased){
    const purchasedTag=document.createElement('span');
    purchasedTag.className='tag tag-soft';
    purchasedTag.textContent='Purchased';
    top.appendChild(purchasedTag);
  }
  if(!it.active){
    const inactiveTag=document.createElement('span');
    inactiveTag.className='tag tag-warn';
    inactiveTag.textContent='Inactive';
    top.appendChild(inactiveTag);
  }
  c.appendChild(top);

  const name=document.createElement('div');
  name.className='name';
  name.contentEditable='true';
  name.textContent=it.name;
  name.addEventListener('blur',()=>{
    const v=name.textContent.trim();
    if(v && v!==it.name){
      database.ref(`lists/${listId}/items/${it.id}`).update({name:v}).then(()=>toast());
    }else{
      name.textContent=it.name;
    }
  });
  c.appendChild(name);

  const g=document.createElement('div'); g.className='rowGrid';

  const sec=document.createElement('div'); sec.className='field sectionField';
  const sel=document.createElement('select');
  SECTIONS.forEach(s=> sel.add(new Option(s,s,s===it.section,s===it.section)));
  sel.onchange=()=> database.ref(`lists/${listId}/items/${it.id}`).update({section:sel.value}).then(()=>{ sectionTag.textContent=sel.value; toast(); });
  sec.appendChild(sel); g.appendChild(sec);

  const qty=document.createElement('div'); qty.className='field qty';
  const minus=iconBtn('−',()=> setQty(it.id,(it.quantity||1)-1),'Decrease quantity');
  const q=document.createElement('input');
  q.type='number';
  q.min='1';
  q.step='1';
  q.value=it.quantity||1;
  q.onblur=()=> setQty(it.id,q.value);
  q.onkeypress=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); q.blur(); } };
  const plus=iconBtn('+',()=> setQty(it.id,(it.quantity||1)+1),'Increase quantity');
  qty.append(minus,q,plus); g.appendChild(qty);

  const purWrap=document.createElement('div'); purWrap.className='field flag';
  const purLabel=document.createElement('span'); purLabel.textContent='Purchased';
  const pur=createSwitch(it.purchased,{
    onText:'Done',
    offText:'Todo',
    ariaOn:'Mark as not purchased',
    ariaOff:'Mark as purchased',
    onToggle:(next)=> database.ref(`lists/${listId}/items/${it.id}`).update({purchased:next}).then(()=>toast(next?'Nice!':'Updated'))
  });
  purWrap.append(purLabel,pur); g.appendChild(purWrap);

  const actWrap=document.createElement('div'); actWrap.className='field flag';
  const actLabel=document.createElement('span'); actLabel.textContent='Active';
  const act=createSwitch(it.active,{
    onText:'Live',
    offText:'Rest',
    ariaOn:'Move to inactive',
    ariaOff:'Move to active',
    onToggle:(next)=> database.ref(`lists/${listId}/items/${it.id}`).update({active:next}).then(()=>toast(next?'Reactivated':'Archived'))
  });
  actWrap.append(actLabel,act); g.appendChild(actWrap);

  const del=document.createElement('div'); del.className='actions';
  const delBtn=document.createElement('button');
  delBtn.className='delBtn';
  delBtn.type='button';
  delBtn.textContent='×';
  delBtn.setAttribute('aria-label',`Delete ${it.name}`);
  delBtn.onclick=()=> onDelete(it.id);
  del.appendChild(delBtn); g.appendChild(del);

  c.appendChild(g);
  return c;
}

function createSwitch(initial,{onText='On',offText='Off',ariaOn='Switch off',ariaOff='Switch on',onToggle}){
  const btn=document.createElement('button');
  btn.className='switch';
  btn.type='button';
  const knob=document.createElement('span'); knob.className='switchKnob';
  const text=document.createElement('span'); text.className='switchText';
  btn.append(knob,text);

  const apply=(state)=>{
    btn.classList.toggle('on',state);
    btn.setAttribute('aria-pressed',state?'true':'false');
    btn.setAttribute('aria-label',state?ariaOn:ariaOff);
    text.textContent=state?onText:offText;
  };
  apply(initial);

  btn.onclick=()=>{
    if(!onToggle) return;
    const current=btn.getAttribute('aria-pressed')==='true';
    const next=!current;
    apply(next);
    btn.disabled=true;
    Promise.resolve(onToggle(next))
      .catch(()=>{ apply(current); })
      .finally(()=>{ btn.disabled=false; });
  };

  return btn;
}

function iconBtn(txt,fn,label){
  const b=document.createElement('button');
  b.className='iconBtn';
  b.type='button';
  b.textContent=txt;
  if(label) b.setAttribute('aria-label',label);
  b.onclick=fn;
  return b;
}
function setQty(id,val){ const q=clampInt(val,1); return database.ref(`lists/${listId}/items/${id}`).update({quantity:q}).then(()=>toast()); }
function onDelete(id){ if(confirm('Delete this item?')) database.ref(`lists/${listId}/items/${id}`).remove().then(()=>toast('Deleted')); }

/*** Bulk ops ***/
function bulkActive(section,flag){
  const updates={}; Object.entries(grocery).forEach(([id,it])=>{ if(it.section===section) updates[`lists/${listId}/items/${id}/active`]=flag; });
  if(Object.keys(updates).length) database.ref().update(updates).then(()=>toast(flag?'Reactivated':'Archived'));
}

/*** Controls ***/
document.getElementById('quickBtn').onclick=()=>{
  const input=qs('#quick');
  const t=input.value.trim();
  if(!t){ toast('Add an item name'); input.focus(); return; }
  const items=parseQuick(t);
  if(!items.length){ toast('Try milk x2 @dairy'); input.focus(); return; }
  Promise.all(items.map(upsertItem)).then(()=>{ input.value=''; toast('Added'); });
};
qs('#quick').addEventListener('keypress',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('quickBtn').click(); }});
qs('#search').addEventListener('input',e=>{ filter=e.target.value.trim().toLowerCase(); render(); });

qs('#tabActive').onclick=()=>{ showActive=true; tabSet(true); render(); };
qs('#tabInactive').onclick=()=>{ showActive=false; tabSet(false); render(); };
function tabSet(active){
  qs('#tabActive').classList.toggle('active', active);
  qs('#tabInactive').classList.toggle('active', !active);
  qs('#tabActive').setAttribute('aria-selected', active?'true':'false');
  qs('#tabInactive').setAttribute('aria-selected', !active?'true':'false');
}

/* Copy active list */
qs('#copyBtn').onclick=async()=>{
  const active = Object.values(grocery).filter(it=>it.active && !it.purchased);
  const txt = active.map(it=>`${it.name} x${it.quantity} [${it.section}]`).join('\n');
  await navigator.clipboard.writeText(txt);
  toast('Copied');
};

initFirebase();
</script>
